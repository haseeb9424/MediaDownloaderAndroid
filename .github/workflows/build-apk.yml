name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build ARM64 debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MediaDownloader-Android-arm64-beta.apk

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaDownloader-Android-arm64-beta
          path: MediaDownloader-Android-arm64-beta.apk
          if-no-files-found: error

      - name: Publish / update direct GitHub Release APK
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-beta >/dev/null 2>&1; then
            gh release upload android-beta MediaDownloader-Android-arm64-beta.apk --clobber
          else
            gh release create android-beta MediaDownloader-Android-arm64-beta.apk \
              --title "Media Downloader Android Beta" \
              --notes "Latest ARM64 beta build. Designed for modern 64-bit Android phones." \
              --prerelease
          fi
